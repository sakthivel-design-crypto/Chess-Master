<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#78350F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="140" fill="#F59E0B" opacity="0.12" filter="url(#goldGlow)"/>

  <!-- Queen / Knight Chess Crest Silhouette -->
  <g transform="translate(106, 76) scale(1.0)">
    <!-- Main Silhouette -->
    <path d="M 42 360 C 42 368, 258 368, 258 360 C 262 355, 252 344, 236 344 C 240 338, 232 328, 222 324 C 212 270, 172 235, 166 195 C 174 195, 176 186, 170 182 C 166 178, 172 152, 186 138 C 208 116, 228 102, 222 84 A 6.5 6.5 0 1 0 210 84 C 204 100, 192 110, 180 80 A 6.5 6.5 0 1 0 168 80 C 160 98, 154 98, 150 36 C 146 98, 140 98, 132 80 A 6.5 6.5 0 1 0 120 80 C 108 110, 96 100, 90 84 A 6.5 6.5 0 1 0 78 84 C 72 102, 92 116, 114 138 C 128 152, 134 178, 130 182 C 124 186, 126 195, 134 195 C 128 235, 88 270, 78 324 C 68 328, 60 338, 64 344 C 48 344, 38 355, 42 360 Z" 
          fill="url(#goldGrad)" 
          filter="url(#goldGlow)"/>

    <!-- Inner Crown Jewels Highlights -->
    <circle cx="150" cy="36" r="8" fill="#FFFBEB"/>
    <circle cx="174" cy="80" r="7" fill="#FFFBEB"/>
    <circle cx="126" cy="80" r="7" fill="#FFFBEB"/>
    <circle cx="216" cy="84" r="7" fill="#FFFBEB"/>
    <circle cx="84" cy="84" r="7" fill="#FFFBEB"/>

    <!-- Elegant Collar Line -->
    <path d="M 115 195 C 138 190 162 195 185 195" fill="none" stroke="#FFFBEB" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
